<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>MapperR</title>
  <defs>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.5" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Runtime engine: solid lane -->
  <path d="M11,20 H24 C34,20 36,32 45,32" stroke="url(#lane)" stroke-width="4.5" stroke-linecap="round"
        fill="none" filter="url(#glow)"/>

  <!-- Generated code: dotted lane -->
  <path d="M11,44 H24 C34,44 36,32 45,32" stroke="url(#lane)" stroke-width="4.5" stroke-linecap="round"
        stroke-dasharray="0.5 9" fill="none" filter="url(#glow)"/>

  <!-- Same destination object -->
  <rect x="45" y="26" width="12" height="12" rx="3.5" fill="#22c55e" filter="url(#glow)"/>
</svg>
